<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog Basement — Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px;
    }

    .icon {
      font-size: 64px;
      line-height: 1;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #f1f5f9;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.6;
    }

    button {
      margin-top: 8px;
      padding: 10px 28px;
      background-color: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    button:hover {
      background-color: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📦</div>
    <h1>You're offline</h1>
    <p>Backlog Basement needs an internet connection. Check your connection and try again.</p>
    <button onclick="window.location.href='https://backlogbasement.com'">Try again</button>
  </div>
</body>
</html>
